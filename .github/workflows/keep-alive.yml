name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9am UTC
  workflow_dispatch:

# Needed so the heartbeat step can commit to the repo.
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Keeps the free Supabase project from pausing (it pauses after 7 days with no traffic).
      # If this fails, the run goes red and GitHub emails a failure notice.
      - name: Ping Supabase
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/health_check?select=updated_at" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      # GitHub disables scheduled workflows in public repos after 60 days with no repo
      # activity. This commit is that activity, so the schedule never switches itself off.
      # Runs even if the ping failed.
      - uses: actions/checkout@v4
        if: always()

      - name: Record heartbeat
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: weekly keep-alive heartbeat"
          git push
